<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'">
<link rel="stylesheet" href="board-art.css"><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#061825;font-family:system-ui,sans-serif}#board{position:absolute;--cell:64px;--map-counter-angle:0deg}#empty{position:absolute;inset:0;display:grid;place-items:center;color:#b5dce4;font-size:16px;text-align:center;padding:20px;background-image:linear-gradient(#3fa1ac18 1px,transparent 1px),linear-gradient(90deg,#3fa1ac18 1px,transparent 1px);background-size:32px 32px}[hidden]{display:none!important}
</style><div id="empty">Das Raumgefüge entsteht hier…</div><div id="board" role="img" aria-label="Gespeicherter Spielaufbau"></div>
<script src="board-art.js"></script><script>
'use strict';let plan={tiles:[],players:[],subdivisions:2};
function renderPortal(next){plan=next;const root=document.getElementById('board');root.replaceChildren();document.getElementById('empty').hidden=plan.tiles.length>0;if(!plan.tiles.length)return;
 const minX=Math.min(...plan.tiles.map(t=>t.x)),minY=Math.min(...plan.tiles.map(t=>t.y)),maxX=Math.max(...plan.tiles.map(t=>t.x+BoardArt.tileSize(t)[0])),maxY=Math.max(...plan.tiles.map(t=>t.y+BoardArt.tileSize(t)[1]));
 const cols=maxX-minX,rows=maxY-minY,unit=Math.max(1,Math.min((innerWidth-24)/cols,(innerHeight-24)/rows));root.style.setProperty('--cell',unit+'px');root.style.width=cols*unit+'px';root.style.height=rows*unit+'px';root.style.left=(innerWidth-cols*unit)/2+'px';root.style.top=(innerHeight-rows*unit)/2+'px';
 for(const tile of plan.tiles){const element=document.createElement('div'),[w,h]=BoardArt.tileSize(tile);element.className='board-tile';element.dataset.cell=tile.x+','+tile.y;element.style.left=(tile.x-minX)*unit+'px';element.style.top=(tile.y-minY)*unit+'px';element.style.width=w*unit+'px';element.style.height=h*unit+'px';BoardArt.decorateTile(element,tile,plan.subdivisions);root.append(element)}
 plan.players.forEach((p,i)=>{if(p.x<0||p.y<0)return;const marker=document.createElement('span');marker.className='board-marker';marker.textContent=String(i+1);marker.title=p.name+' · '+BoardArt.fieldName({board:plan},p.x,p.y);marker.style.left=((p.x+.78)/plan.subdivisions-minX)*unit+'px';marker.style.top=((p.y+.22)/plan.subdivisions-minY)*unit+'px';root.append(marker)});
}
window.addEventListener('resize',()=>renderPortal(plan));
</script></html>
