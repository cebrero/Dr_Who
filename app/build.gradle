plugins { id 'com.android.application' }
android {
    namespace 'de.cebrero.drwho'
    buildFeatures { buildConfig true }
    compileSdk 36
    defaultConfig {
        applicationId 'de.cebrero.drwho'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('drWhoVersionCode').get().toInteger()
        versionName providers.gradleProperty('drWhoVersionName').get()
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir(rootProject.layout.buildDirectory.dir('generated/onboardingAssets'))
}
dependencies {
    implementation project(':core')
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'org.slf4j:slf4j-nop:2.0.17'
    implementation 'com.google.zxing:core:3.5.3'
}
tasks.named('preBuild') { dependsOn rootProject.tasks.named('generateOnboardingAsset') }
