name: Android und Spielkern prüfen
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK prüfen
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Tests und Debug-APK
        run: ./gradlew :core:smokeTest :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Dr_Who-debug
          path: app/build/outputs/apk/debug/app-debug.apk
